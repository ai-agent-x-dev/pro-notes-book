name: Deploy to GitHub Pages

# Publish the site on every push to main, with no build step: the repository is
# already the finished artifact. The alternative ("Deploy from a branch") runs
# Jekyll and shows no per-step logs, which makes a failure invisible until
# someone opens the browser and sees a 404. Here the run log is the diagnosis.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Actions are pinned to full commit SHAs, not tags: a tag can be moved to
# different code, a SHA cannot. The comment names the release; bump both
# together (Dependabot's github-actions ecosystem does this automatically).
#
# Least privilege: read the repo, write only to Pages, and sign the OIDC token
# that deploy-pages exchanges for a deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # No build step on purpose. There is no _config.yml, no Gemfile and no
      # Liquid template, so Jekyll would only add a failure mode. The static
      # files are the output.
      #
      # But publish an ALLOWLIST, not the repository root. Deploying via
      # Actions bypasses Jekyll, so nothing filters `_` or `.` paths any more:
      # uploading '.' served _worker.js, .gitignore and anything else that
      # was ever committed. The list lives in tools/assemble-site.sh, shared
      # with the Cloudflare deploy; it fails the job if a listed file is
      # missing. No --with-worker: GitHub Pages must not serve _worker.js.
      - name: Assemble the published files
        run: sh tools/assemble-site.sh

      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
